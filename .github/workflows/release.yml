name: Release & Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows 11 (x64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app_folder/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app_folder/src-tauri -> target

      - name: Install frontend dependencies & verify tests
        shell: pwsh
        run: |
          Push-Location app_folder
          npm ci
          npm run lint
          npm test
          Pop-Location
          cargo test --manifest-path io_folder/Cargo.toml

      - name: Build Windows 11 binary & installers (NSIS + MSI)
        working-directory: app_folder
        run: npm run tauri build -- --bundles nsis,msi

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $out = "dist-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "app_folder\src-tauri\target\release\rakz.exe" "$out\rakz.exe" -Force
          Get-ChildItem "app_folder\src-tauri\target\release\bundle\nsis\*-setup.exe" | ForEach-Object { Copy-Item $_.FullName "$out\$($_.Name)" -Force }
          Get-ChildItem "app_folder\src-tauri\target\release\bundle\msi\*.msi" | ForEach-Object { Copy-Item $_.FullName "$out\$($_.Name)" -Force }
          Get-ChildItem $out

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-windows/*

  build-macos:
    name: Build macOS (Universal — Apple Silicon & Intel)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app_folder/package-lock.json

      - name: Setup Rust stable (Apple Silicon + Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app_folder/src-tauri -> target

      - name: Install frontend dependencies & verify tests
        run: |
          cd app_folder
          npm ci
          npm run lint
          npm test
          cd ..
          cargo test --manifest-path io_folder/Cargo.toml

      - name: Build Universal macOS app & DMG
        working-directory: app_folder
        env:
          CI: "true"
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg,app

      - name: Stage macOS artifacts
        run: |
          mkdir -p dist-macos
          cp app_folder/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-macos/
          ls -lh dist-macos/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist-macos/*

  build-linux:
    name: Build Linux (AppImage, deb, rpm)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            rpm \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app_folder/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app_folder/src-tauri -> target

      - name: Install frontend dependencies & verify tests
        run: |
          cd app_folder
          npm ci
          npm run lint
          npm test
          cd ..
          cargo test --manifest-path io_folder/Cargo.toml

      - name: Build Linux packages (AppImage, deb, rpm)
        working-directory: app_folder
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Stage Linux artifacts
        run: |
          mkdir -p dist-linux
          cp app_folder/src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/
          cp app_folder/src-tauri/target/release/bundle/deb/*.deb dist-linux/
          cp app_folder/src-tauri/target/release/bundle/rpm/*.rpm dist-linux/
          ls -lh dist-linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-linux/*

  publish-release:
    name: Publish Cross-Platform GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Download all OS release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "RAKZ ${{ steps.meta.outputs.tag }} — Windows 11, macOS & Linux"
          make_latest: true
          files: release-assets/*
          body: |
            ## RAKZ ${{ steps.meta.outputs.tag }} — Cross-Platform Desktop Release

            Built cleanly on GitHub Actions (`windows-latest`, `macos-14` universal, `ubuntu-22.04`) with all frontend (`vue-tsc`, ESLint, Vitest 23/23) and Rust IO sandbox tests passing on all three platforms.

            ### Downloads

            #### Windows 11 (x64)
            - **`RAKZ_${{ steps.meta.outputs.version }}_x64-setup.exe`** — Recommended per-user NSIS installer (no admin required, embeds WebView2 bootstrapper, registers `.mns` file association).
            - **`RAKZ_${{ steps.meta.outputs.version }}_x64_en-US.msi`** — Standard Windows MSI installer.
            - **`rakz.exe`** — Standalone portable Windows 11 executable (`PerMonitorV2` DPI, `longPathAware`, UTF-8 manifest).

            #### macOS (Apple Silicon & Intel — macOS 11+)
            - **`RAKZ_${{ steps.meta.outputs.version }}_universal.dmg`** — Universal binary (native Apple Silicon M1–M4 + Intel x86_64). Drag `RAKZ.app` to Applications.
            - *Unsigned open-source app note:* On first launch, if macOS Gatekeeper warns the app is from an unidentified developer, run once in Terminal:
              ```bash
              xattr -cr /Applications/RAKZ.app
              ```

            #### Linux (x86_64)
            - **`RAKZ_${{ steps.meta.outputs.version }}_amd64.AppImage`** — Universal portable Linux binary (`chmod +x RAKZ_*.AppImage && ./RAKZ_*.AppImage`).
            - **`RAKZ_${{ steps.meta.outputs.version }}_amd64.deb`** — Debian / Ubuntu / Mint / Pop!_OS (`sudo apt install ./RAKZ_*.deb`).
            - **`RAKZ-${{ steps.meta.outputs.version }}-1.x86_64.rpm`** — Fedora / RHEL / openSUSE (`sudo dnf install ./RAKZ-*.rpm`).

            ### Verify Integrity
            Compare your download against **`SHA256SUMS.txt`**:
            ```bash
            # macOS / Linux
            shasum -a 256 -c SHA256SUMS.txt --ignore-missing
            ```
            ```powershell
            # Windows PowerShell
            Get-FileHash .\RAKZ_${{ steps.meta.outputs.version }}_x64-setup.exe -Algorithm SHA256
            ```

  publish-engine-package:
    name: Publish @obiedam/rakz-engine to GitHub Packages
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@obiedam"

      - name: Stage, compile, and publish scoped engine package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          OWNER_LOWER="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          PKG_NAME="@${OWNER_LOWER}/rakz-engine"
          if npm view "${PKG_NAME}@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${PKG_NAME}@${VERSION} is already published — skipping."
            exit 0
          fi

          STAGE="$(mktemp -d)"
          cp -R engine_folder/. "$STAGE/"
          cd "$STAGE"
          npm ci --ignore-scripts --registry=https://registry.npmjs.org

          cat > tsconfig.build.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "declaration": true,
              "outDir": "./dist",
              "rootDir": "./src",
              "strict": true,
              "skipLibCheck": true,
              "esModuleInterop": true
            },
            "include": ["src/**/*.ts"]
          }
          EOF

          npx --yes --package=typescript@5.8.3 --registry=https://registry.npmjs.org tsc -p tsconfig.build.json

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '${PKG_NAME}';
            pkg.version = '${VERSION}';
            pkg.private = false;
            pkg.license = 'GPL-3.0-or-later';
            pkg.repository = { type: 'git', url: 'https://github.com/${REPO_FULL}.git' };
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            pkg.main = './dist/index.js';
            pkg.types = './dist/index.d.ts';
            pkg.exports = { '.': { types: './dist/index.d.ts', import: './dist/index.js' } };
            pkg.files = ['dist', 'src'];
            delete pkg.devDependencies;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          npm publish --registry=https://npm.pkg.github.com
